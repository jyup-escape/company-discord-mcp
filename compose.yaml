services:
  mcp:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/company-discord.db
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - mcp_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  mcp_data:
