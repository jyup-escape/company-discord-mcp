name: Release employee setup

on:
  push:
    tags: ['setup-v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:setup-cli
      - run: npm run pack:setup
      - run: npx --yes ./setup-artifacts/company-discord-setup.tgz --help

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const p=require('./packages/company-discord-setup/package.json'); if(process.env.RELEASE_TAG !== 'setup-v'+p.version) process.exit(1)"
      - run: npm run pack:setup
      - name: Publish setup archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" setup-artifacts/company-discord-setup.tgz --title "Employee setup $RELEASE_TAG" --generate-notes --latest
